name: Sync Vercel Preview Env

# Pushes the hub's data-source configuration into Vercel's PREVIEW environment,
# using repo secrets that scripts/sync-secrets.sh already synced from 1Password.
#
# Why this exists: preview deployments never had these variables — sync-secrets
# only ever wrote `vercel env add <name> production` — so every preview rendered
# from data/*.json instead of live data. Removing that JSON tier (2026-08-21)
# turned preview into a 500, which is how the gap surfaced.
#
# 1Password remains the source of truth. This does NOT read the vault; it copies
# values that were already derived from it into a second derived place, so that
# fixing preview does not require a laptop with `op` unlocked. When a value
# changes, run `./scripts/sync-secrets.sh --apply` (which updates both the repo
# secrets and Vercel production), then dispatch this to refresh preview.
#
# Manual only. Vercel env vars bind at deploy time, so after this runs, deploy
# again (push to the branch, or dispatch "Deploy Hub") before the preview picks
# them up.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-preview-env

jobs:
  sync:
    name: Sync preview env
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Install Vercel CLI
        run: npm install -g vercel@56

      - name: Push data-source config to preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTION_EXPERIMENTS_DATA_SOURCE_ID: ${{ secrets.NOTION_EXPERIMENTS_DATA_SOURCE_ID }}
          NOTION_HISTORY_DATA_SOURCE_ID: ${{ secrets.NOTION_HISTORY_DATA_SOURCE_ID }}
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN not set — nothing to sync." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Only the variables the site needs to READ ITS OWN DATA. Payment and
          # model keys stay production-only on purpose: a preview URL is a lower
          # bar to reach than production, and nothing in a preview should be able
          # to charge a card.
          names="SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY NOTION_EXPERIMENTS_DATA_SOURCE_ID NOTION_HISTORY_DATA_SOURCE_ID"

          synced=0
          missing=""
          for name in $names; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              missing="$missing $name"
              continue
            fi
            # rm-then-add is how sync-secrets.sh writes too: `vercel env add`
            # fails on an existing name rather than replacing it.
            vercel env rm "$name" preview --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
            printf '%s' "$value" | vercel env add "$name" preview --token="$VERCEL_TOKEN" >/dev/null
            echo "  + $name" >> "$GITHUB_STEP_SUMMARY"
            synced=$((synced + 1))
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Synced $synced variable(s) to the preview environment." >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$missing" ]; then
            echo "Not set as repo secrets, skipped:$missing" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Deploy again for a preview to pick these up." >> "$GITHUB_STEP_SUMMARY"
