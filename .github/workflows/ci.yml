name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  # ── Unit tests (root) ───────────────────────────────────────────────────────
  # Runs on every push and every PR. No secrets needed — all external calls
  # are mocked. Fast (~10s). Gate before merge.
  unit-tests:
    name: Feature tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  # ── Lint & typecheck ────────────────────────────────────────────────────────
  # Nothing ran `pnpm lint` in CI until 2026-08-21, which is how a TS2322 in
  # tests/lib/supabase.test.ts sat broken on main unnoticed — the unit tests pass
  # because vitest transpiles without typechecking. This job closes that gap.
  #
  # Two steps, because they cover different things and neither subsumes the
  # other. The turbo step typechecks; the eslint step applies the lint rules
  # types cannot see. Until 2026-08-21 the hub had no working eslint at all: a
  # root .eslintrc.json existed but had been dead since the ESLint 9 upgrade,
  # which looks for eslint.config.* and errors rather than falling back to
  # eslintrc. See eslint.config.js.
  #
  # Filtered to exclude simple-seed-organizer: its eslint already runs in
  # seed-organizer-ci.yml, path-filtered to its own directory, and running it
  # here too would defeat that filter on every hub-only push. The negation form
  # (rather than naming packages) means a new workspace package is covered
  # automatically.
  #
  # Despite the name, both remaining packages run `tsc --noEmit` and neither has
  # its own tsconfig, so both resolve the ROOT tsconfig — this typechecks the
  # whole hub (app/, lib/, components/, tests/), not just packages/.
  typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run lint --concurrency=2 --filter='!simple-seed-organizer'

      # ESLint over the hub's own app/, lib/, components/, scripts/, tests/.
      # Separate from the turbo run above because the hub root package's `lint`
      # script IS that turbo orchestrator — it cannot also be its own eslint
      # invocation without recursing.
      - name: Lint (hub app)
        run: pnpm run lint:app

  # Seed organizer jobs (unit tests, build check, lint) live in
  # seed-organizer-ci.yml, path-filtered to experiments/simple-seed-organizer/**
  # and packages/** so hub-only changes skip them.

  # ── Live integration tests ──────────────────────────────────────────────────
  # Runs on push to main (after merge) AND on PRs opened by the repo owner.
  # Hits the real Supabase project: inserts a test row, verifies it, cleans up.
  # Requires SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY in GitHub Actions secrets.
  # The owner-gate prevents secret exposure to PRs from other contributors —
  # they get the unit-tests gate only. See openspec/changes/sso-zip-code-persistence/.
  live-integration:
    name: Live integration tests
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request' && github.actor == github.repository_owner)
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run live integration tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          # Simple Seed Organizer runs its own Supabase project; its live test
          # skips when these are absent rather than failing against hub tables.
          SSO_SUPABASE_URL: ${{ secrets.SSO_SUPABASE_URL }}
          SSO_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SSO_SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm run test:live
