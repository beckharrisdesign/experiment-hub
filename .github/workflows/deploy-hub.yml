name: Deploy Hub

# Vercel's own Git auto-deploy is turned off for all projects
# (`git.deploymentEnabled: false` in each vercel.json) so behind-the-scenes
# changes never create a deployment — even a skipped one counts toward the
# Hobby daily deployment limit. This workflow is the only thing that deploys
# the hub, and only when APP code actually changes: the `paths-ignore` list
# below skips agent-instruction / schema / docs / experiment changes.
#
# Deploys a preview on app-code PRs; production on app-code merges to main.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       — a token from https://vercel.com/account/tokens
#   VERCEL_ORG_ID      — team_UhPjDkhxW0b4JX399pdc4iYs
#   VERCEL_PROJECT_ID  — prj_ejSeutScnvJpS2TzHBGkJAF33TBL (experiment-hub)
# Until VERCEL_TOKEN is set, this workflow no-ops (green) instead of failing.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'experiments/**'
      - 'docs/**'
      - 'openspec/**'
      - 'rules/**'
      - 'skills/**'
      - '.claude/**'
      - '.cursor/**'
      - '.github/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'experiments/**'
      - 'docs/**'
      - 'openspec/**'
      - 'rules/**'
      - 'skills/**'
      - '.claude/**'
      - '.cursor/**'
      - '.github/**'
      - '*.md'
  # Manual trigger — needed when only env vars changed (no code push to
  # deploy them) since Vercel git auto-deploy is off. Dispatch on main
  # deploys production.
  workflow_dispatch:

env:
  # Project/org IDs are not secret; the token is. Kept in secrets for convenience.
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

# The deploy step creates/edits the sticky preview comment via the issue-comments
# API, which needs pull-requests write; keep everything else read-only.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy hub
    runs-on: ubuntu-latest
    # Only the repo owner's events may use the Vercel token (mirrors ci.yml's
    # live-integration gate) — PRs from other contributors get no deploy.
    if: github.event_name == 'push' || github.actor == github.repository_owner
    steps:
      - name: Check for required Vercel secrets
        id: guard
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Missing one or more Vercel secrets (VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID) — skipping deploy (add all three to enable)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Vercel CLI
        if: steps.guard.outputs.skip != 'true'
        # Pinned major for reproducible deploys — bump intentionally. Must be
        # recent enough for the project's Node.js version (24.x needs a current CLI).
        run: npm install -g vercel@56

      - name: Resolve target (production on main, preview otherwise)
        if: steps.guard.outputs.skip != 'true'
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && { [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; }; then
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          fi

      # Preview deployments carry their runtime credentials from the vault,
      # attached to the deployment itself — Vercel's preview environment stores
      # nothing. A stored copy is a copy that drifts: it goes stale the moment a
      # value rotates, and nothing notices until a preview quietly reads the
      # wrong thing. Reading at deploy time means a preview always runs on
      # whatever 1Password holds right now.
      #
      # Production is untouched: it has stored env vars, synced by
      # scripts/sync-secrets.sh.
      - name: Check for the 1Password service account token
        if: steps.guard.outputs.skip != 'true' && steps.target.outputs.env == 'preview'
        run: |
          if [ -z "${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}" ]; then
            echo "::error::Preview deploys read their credentials from 1Password at deploy time, and OP_SERVICE_ACCOUNT_TOKEN is not set. Create a 1Password service account with read access to the BHD Labs vault, then add its token as a repo secret (Settings → Secrets and variables → Actions). Failing here rather than shipping a preview that 500s on every page."
            exit 1
          fi

      - name: Read preview runtime credentials from 1Password
        if: steps.guard.outputs.skip != 'true' && steps.target.outputs.env == 'preview'
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          # Only what the site needs to READ ITS OWN DATA. Payment and model
          # keys stay production-only: a preview URL is an easier bar to clear
          # than production, and nothing in a preview should be able to charge a
          # card. Refs must match scripts/sync-secrets.sh — .env.example is the
          # registry of record for both.
          SUPABASE_URL: op://BHD Labs/Supabase experiment-hub/url
          SUPABASE_SERVICE_ROLE_KEY: op://BHD Labs/Supabase experiment-hub/service role key
          NOTION_EXPERIMENTS_DATA_SOURCE_ID: op://BHD Labs/Notion/experiments data source id
          NOTION_HISTORY_DATA_SOURCE_ID: op://BHD Labs/Notion/history data source id

      - name: Pull Vercel project settings
        if: steps.guard.outputs.skip != 'true'
        run: vercel pull --yes --environment=${{ steps.target.outputs.env }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        if: steps.guard.outputs.skip != 'true'
        run: vercel build ${{ steps.target.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        if: steps.guard.outputs.skip != 'true'
        id: deploy
        run: |
          set -euo pipefail

          # `vercel deploy --env KEY=value` sets RUNTIME env for this deployment
          # only (https://vercel.com/docs/cli/deploy). That is what makes a
          # preview work without Vercel storing the values: the page reads them
          # at request time from the deployment it was served by.
          env_args=()
          if [ "${{ steps.target.outputs.env }}" = "preview" ]; then
            for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY \
                        NOTION_EXPERIMENTS_DATA_SOURCE_ID NOTION_HISTORY_DATA_SOURCE_ID; do
              value="${!name:-}"
              if [ -n "$value" ]; then
                env_args+=( --env "$name=$value" )
              fi
            done
          fi

          # --archive=tgz uploads one tarball instead of thousands of files,
          # staying far under Vercel's 5000-uploads/24h hobby-plan cap.
          url=$(vercel deploy --prebuilt --archive=tgz ${{ steps.target.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }} "${env_args[@]}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed (${{ steps.target.outputs.env }}) → $url" >> "$GITHUB_STEP_SUMMARY"

      # One comment per PR, edited in place — not a new comment per deploy.
      #
      # Turning off Vercel's Git integration (#311, to stop every push creating a
      # deployment record against the Hobby daily cap) also removed the bot's
      # status table, and the one-line replacement appended a fresh comment on
      # every push. This restores the table Vercel used to post without restoring
      # the integration that caused the rate limiting.
      #
      # Found by MARKER, an HTML comment that does not render. First deploy on a
      # PR creates the comment; later ones PATCH that same id.
      #
      # Runs with !cancelled() rather than success() so a FAILED deploy updates
      # the table to Error instead of leaving a stale Ready from the last push.
      - name: Comment preview URL on PR
        if: ${{ !cancelled() && steps.guard.outputs.skip != 'true' && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed as env, never interpolated into the script body: a branch or
          # commit message reaching the shell directly would be an injection.
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          TARGET_ENV: ${{ steps.target.outputs.env }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          MARKER='<!-- deploy-hub:preview -->'

          if [ "$DEPLOY_OUTCOME" = "success" ] && [ -n "$DEPLOY_URL" ]; then
            status='🟢 Ready'
            preview="[Visit Preview]($DEPLOY_URL)"
          else
            status='🔴 Error'
            preview="[View logs]($RUN_URL)"
          fi

          # Mirrors the column layout Vercel's bot used, so the PR reads the same.
          updated=$(date -u '+%b %d, %Y %-I:%M%p' | sed 's/AM$/am/; s/PM$/pm/')

          body=$(cat <<EOF
          $MARKER
          The latest updates on your deployment. Built and deployed by [Deploy Hub]($RUN_URL) — Vercel's Git integration is intentionally off (see workflow header).

          | Project | Deployment | Environment | Preview | Updated (UTC) |
          | --- | --- | --- | --- | --- |
          | experiment-hub | $status | $TARGET_ENV | $preview | $updated |
          EOF
          )
          # The heredoc is indented to match the YAML block; strip that back off.
          body=$(printf '%s\n' "$body" | sed 's/^          //')

          # --jq runs per PAGE, so a PR past 100 comments can emit one line per
          # page; head -n1 keeps $existing a single id. Oldest match wins, which
          # is the comment created on the first deploy.
          existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "map(select(.body | contains(\"$MARKER\"))) | .[0].id // empty" \
            | head -n1)

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" >/dev/null
            echo "Updated existing preview comment ($existing)." >> "$GITHUB_STEP_SUMMARY"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
            echo "Created preview comment." >> "$GITHUB_STEP_SUMMARY"
          fi
