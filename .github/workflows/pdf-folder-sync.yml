# Folder sync for the PDF Organizer (pdf-metadata-viewer): the twice-daily check,
# and the way to run it by hand. The clock is the database, every ten minutes
# (supabase/migrations/035_pdf_sync_schedule.sql): GitHub ran this job twice in a
# day when it was set for every hour. This one stays because its failures send an
# email, and because any run gives the database's schedule its key.
#
# Finds new PDFs in the chosen Drive folder and reads each unread file's own
# values (page count, title, author, subject, keywords), so the list fills in
# without opening files one by one, then draws and keeps the pages of documents
# not yet drawn (task 7f) and the text on them (task 7h). The work happens in the hub's own function
# (POST /api/pdf-drive/sync, lib/pdf-sync.ts); this job only starts it, and no
# document bytes or values pass through GitHub — the answer is counts.
# openspec/changes/pdf-metadata-viewer-cloud — task 7d, design.md D12.
#
# Auth needs no credential of its own: the job derives the route's key from
# SUPABASE_SERVICE_ROLE_KEY the way lib/pdf-auth.ts does (verifySyncKey), as
# exec-function-daily.yml does for its route. Keep the label below in step with
# SYNC_KEY_LABEL.
#
# Each call works for about 40 s; the job makes up to eight while there is work
# left, and leaves the rest for the next run.
name: pdf-folder-sync

on:
  schedule:
    # Minute 23, away from the top of the hour, when GitHub's queue is busiest.
    - cron: "23 11,23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-folder-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: "Production – experiment-hub"
    timeout-minutes: 12
    steps:
      - name: Run the folder sync
        env:
          SITE_URL: https://labs.beckharrisdesign.com
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is not available to this job"
            exit 1
          fi

          SYNC_KEY=$(printf '%s' 'pdf-metadata-viewer/folder-sync/v1' \
            | openssl dgst -sha256 -hmac "$SUPABASE_SERVICE_ROLE_KEY" -r \
            | cut -d' ' -f1)

          # Each call works for under a minute. Go on while it's getting
          # somewhere and work is left, so a run by hand finishes what it can.
          for round in 1 2 3 4 5 6 7 8; do
            status=$(curl -sS -o response.json -w '%{http_code}' --max-time 90 \
              -X POST "${SITE_URL}/api/pdf-drive/sync" \
              -H "x-pdf-sync-key: ${SYNC_KEY}")

            echo "Round ${round}: HTTP ${status}"
            cat response.json
            echo

            if [ "$status" = "409" ]; then
              echo "::error::Drive access needs re-authorizing — sign in to the PDF Organizer again"
              exit 1
            fi
            if [ "$status" != "200" ]; then
              echo "::error::the folder sync failed"
              exit 1
            fi

            left=$(jq '(.remaining // 0) + (.pages.pagesWaiting // 0) + (.text.textWaiting // 0)' response.json)
            did=$(jq '(.read // 0) + (.pages.pagesDrawn // 0) + (.text.textPages // 0)' response.json)
            if [ "$left" = "0" ] || [ "$did" = "0" ]; then break; fi
          done
