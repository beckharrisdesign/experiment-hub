# Project OpenSpec defaults (see `@fission-ai/openspec` project-config).
# New changes use `schema` unless overridden in openspec/changes/<name>/.openspec.yaml.
schema: experiment-hub-lite

context: |
  Experiment Hub workflow. **`experiment-hub-lite` is the schema.** Do not shop for
  a schema when starting a change — scaffold with the default and get on with it.

  **Human anchor** — founder prose quoted in proposal.md (or experiments/<slug>/docs/intent.md) before specs/design/tasks.

  **Outcomes-first** — Who / Job / Done when drive specs (max 5 requirements) and tasks §1 (user-visible checkboxes).

  **Skills per artifact** — experiment-creator (proposal), prd-writer (specs/tasks §1), design-advisor (design), prototype-builder (apply). See openspec/schemas/experiment-hub-lite/schema.yaml instructions.

  **The one exception — `bhd-experiment`.** Not an alternative way to run a change;
  it is the backing schema for the hub's own product-lifecycle feature. A change
  uses it only when the experiment's detail page should render phase tabs (spec:
  openspec/specs/hub-bhd-phase-tabs/). Phases: explore.md → propose.md → apply.md →
  archive.md — states, not gates; artifacts stay editable. Code ships via a child
  change with `schema: experiment-hub-lite` and `/opsx:apply` on the child only.
  Per-phase generation rules: rules/bhd-experiment.mdc.

  Scoring store: rules/scoring-criteria.mdc (v2: Mission/Pull/Speed, 1–3 each; re-grade at archive).
