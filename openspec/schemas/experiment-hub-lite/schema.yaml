name: experiment-hub-lite
version: 1
description: Intent-first OpenSpec for experiment spikes — hub skill voices per artifact, no sponsor ladder boilerplate.

artifacts:
  - id: proposal
    generates: proposal.md
    description: Human anchor, outcomes, and scope in plain language (strategist voice).
    template: proposal.md
    instruction: |
      Before writing, read `skills/experiment-creator/SKILL.md` and apply its voice and prohibitions to this artifact only.

      **Human anchor (required):** Quote founder prose verbatim (1–3 sentences). Do not proceed with an empty anchor or agent-only paraphrase without a quoted line. Accept `experiments/<slug>/docs/intent.md` if it exists.

      **Outcomes (required):** Fill Who / Job / Done when / Not doing before Why.

      **Lite constraints:** Max 2 new capabilities (kebab-case). Omit Evidence and Proceed attestation (those belong in full `experiment-hub`). If `experiments/<slug>/docs/PRD.md` exists, link it under Optional links instead of duplicating TAM or business case.

      **Figma round (UI changes — required here, not deferred to design.md):** Any change that alters UI gets a **first round before or alongside the proposal**, not after it. Rough is the point: shape and composition, enough to argue with. The detailed as-is + proposed pair, breakpoints and the Visual design table still belong to `design.md` — this is the round that makes the proposal's scope real, not a replacement for it.

      **Pick the editor by the question the proposal is asking, not by fidelity.** "Figma file" is ambiguous — a FigJam board is one too — so choose deliberately:

      - **FigJam board** (`figma.com/board/...`) when the change is about a **flow, sequence, structure or set of relationships**: what happens in what order, what is in and out of scope, how the pieces connect. A board cannot produce something polished enough to be mistaken for an approval-ready design, which is exactly what you want this early, and it subscribes no libraries — so there is no MVDS step standing between you and thinking.
      - **Design file** (`figma.com/design/...`) when the change is about a **surface**: a panel, page, component or layout. "What does this look like once X is gone" is not a question a board can answer. `retire-umbrella-switches` is the worked example — three switches leaving a panel is a surface question, and a board would have been the wrong tool.

      **Title the file the change ID, with no prefix** — `retire-umbrella-switches`, not `OpenSpec — …`; it is only settable at `create_new_file` time and cannot be renamed by an agent afterwards (`rules/figma.mdc` → File title convention).

      Either way it is `02 Proposed` **on its own page** in the change's own file of that type — boards have real pages too, so the page-per-iteration convention in `rules/figma.mdc` applies unchanged in both editors. Link it from the proposal by **file URL + page name + node ID** (a board page has no frames, so give the anchor section's node ID). A change may legitimately end up with both files — a board that argued the shape, a design file that drew the surface. When it does, the numbering runs continuously **across** the files and `design.md`'s Visual design table carries a row per file, saying which rounds live where.

      Why it sits here: design is in dialogue with the proposal. Writing scope blind and drawing it afterwards means every design round sends you back to re-author a document that was written without seeing the thing — which is how iteration numbering and scope drift out of sync. Rounds are numbered continuously from this first one, so `design.md` records the series rather than starting it.

      **Applies to changes created after this rule landed (2026-09-17)** — the editor choice, the file title and the round numbering alike. A change already in flight keeps both the title and the sequence it was built on — several document `02 Proposed` as intentionally empty because under the old order the first iteration belonged to `design.md`, and `pdf-metadata-viewer-cloud` says so in as many words. Do **not** retro-fit those: rewriting an existing Figma history to satisfy a rule that landed afterwards is the exact churn this change exists to stop. Leave their numbering alone and gate them at `design.md` as planned.

      **Stop rule:** After writing proposal.md, stop and wait for explicit user approval before creating specs, design, or tasks.

  - id: specs
    generates: specs/**/*.md
    description: PM-style requirements with scenarios (prd-writer voice, max 5 requirements).
    template: spec.md
    requires:
      - proposal
    instruction: |
      Before writing, read `skills/prd-writer/SKILL.md` and apply outcomes + scenario patterns to this artifact only (not a full PRD file unless the user asked).

      **Outcomes:** Repeat or point to proposal Outcomes at the top.

      **Requirements:** Max 5 `### Requirement:` blocks. Each requirement: one plain-language sentence, optional **Fails until:** line, then normative SHALL (one line max), then at least one `#### Scenario:` with WHEN/THEN.

      **Alignment:** Scenario titles must match tasks.md §1 checkboxes 1:1.

      **Delta ops:** Use ADDED/MODIFIED/REMOVED only when promoting to `openspec/specs/`; for new capabilities, ADDED is enough.

      **Stop rule:** After writing spec(s), stop and wait for explicit user approval before design or tasks.

  - id: design
    generates: design.md
    description: User flow, Figma, and breakpoints (design-advisor voice).
    template: design.md
    requires:
      - proposal
    instruction: |
      Before writing, read `skills/design-advisor/SKILL.md` and `rules/figma.mdc`; apply checklist thinking to this artifact only (full design report only if user asks).

      **Figma gate (UI changes — REQUIRED, not skippable):** Builds on the round already made at proposal time — continue the numbering, never restart it. Any change that adds or alters UI MUST produce a Figma **as-is + proposed** pair before design.md is approved — the same treatment `openspec/changes/stop-the-leaks/design.md` used:
        1. **As-is frame** — the current surface reconstructed from code (or captured from the running page via `generate_figma_design`); flag any non-code-derivable values as reference per `rules/figma.mdc`.
        2. **Proposed frame(s)** — the changed surface, built on the hub design system (MVDS + `tailwind.config.ts` / `globals.css` tokens), not bespoke chrome.
      Then fill the Visual design / Figma table with the real **file URL**, **as-is + proposed frame names**, **library/version**, breakpoints (BHD Content Types S=480px / L=1024px), and any Code Connect note. "Reuses existing components" is NOT grounds to skip — reused components still get placed in a proposed frame.

      **Recording a board round.** The as-is + proposed pair above is always a design file — a board cannot carry a surface. But a change whose proposal round was a FigJam board records that board as its own row: board URL, **page name + page node ID + the anchor section's node ID** (a board page has pages but no frames), `library/version` naming the FigJam living-diagram conventions it follows, and `N/A` **with the reason** in the two columns a board has no counterpart for — breakpoints (`N/A — FigJam canvas, not a responsive screen`) and Code Connect (`N/A — no code surface`). `openspec/changes/archive/2026-09-16-etsy-ecosystem-map/design.md` is the worked example. A FigJam-first change therefore ends with two rows, and the round series stays auditable across both files.

      **A board that outlives the change** — a map, a standing process flow — additionally follows the living-diagram conventions in `rules/figma.mdc`: version pages (`v1`…`vN`) rather than round numbers, an `Index` page listing iterations newest-first, a `(current)` marker and banner on the live page, and `(superseded)` archive banners linking back. Required by `openspec/specs/ecosystem-map/spec.md`.

      **Removals count as UI changes.** Deleting a page, nav item, or visible component still gets an as-is + proposed pair — the proposed frame shows the surface with the element absent (e.g. the header with one fewer nav item). A deletion rendered this way is reviewable in seconds; "there's nothing to design" is not grounds to skip (precedent: remove-workflow-page, 2026-07-21).

      **N/A is allowed ONLY for genuinely API-only / no-UI changes** — one row "N/A — no UI" with a brief rationale. If the change renders anything a user sees, it is not API-only.

      **Breakpoints:** Reference hub `design-guidelines.mdc` for tokens and spacing.

      **Stop rule:** After writing design.md, stop and wait for explicit user approval before tasks.

  - id: tasks
    generates: tasks.md
    description: User-outcome checkboxes first, then prototype and implementation (prd-writer §0 + prototype-builder).
    template: tasks.md
    requires:
      - specs
      - design
    instruction: |
      Before writing §1, read `skills/prd-writer/SKILL.md` (outcomes / scenario mapping). Before §2+, read `skills/prototype-builder/SKILL.md`.

      **§1 User outcomes:** Copy every spec scenario as a numbered checkbox (1.1, 1.2, …). Wording should be user-visible ("User can …"), not file paths.

      **§2–3:** Prototype shell under `experiments/<slug>/prototype/` when applicable; document dev command with the same package manager as README (`npm` or `pnpm` — do not invent `pnpm` if the repo uses npm).

      **§4 QA:** Include manual walkthrough aligned to Outcomes and automated smoke (vitest or README checklist).

      **Stop rule:** After writing tasks.md, stop and wait for explicit user approval before `/opsx:apply`.

apply:
  requires:
    - tasks
  instruction: |
    Read `skills/openspec-apply-change/SKILL.md` and `skills/prototype-builder/SKILL.md`.

    Before coding: read proposal Outcomes and tasks.md §1; confirm Human anchor still matches what you are building.

    **Prototype path:** Prefer `experiments/<slug>/prototype/`. Assign port from `docs/PROTOTYPE_PORTS.md` and register in `data/prototypes.json` if new.

    **Package manager:** Match README and root `package.json` scripts (this repo often uses `npm`).

    **Completion:** User runs manual §1 checks before `/opsx:archive`. Do not archive until outcomes checkboxes are satisfied or explicitly waived.

    **When apply finishes** (tasks done, paused with progress, or blocked after coding): follow `skills/openspec-apply-change/SKILL.md` step 8 — commit (conventional message per `rules/commit-messages.mdc`; brief but substantive body; branch `<harness>/<change-name>` per `rules/github-workflow.mdc` — e.g. `claude/<change-name>` under Claude Code, not a hardcoded `cursor/`), push, open or update a **ready-for-review** PR via `gh` (not draft, so Copilot reviews immediately — see `rules/github-workflow.mdc`) so CI/CD runs, then run the Copilot review loop. Skip only if the session changed no files. Never merge or approve the PR.
