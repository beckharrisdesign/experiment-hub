<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fontconfig for serverless image generation (Etsy Listing Kit).
  Vercel's runtime ships zero fonts, so SVG text rendered via sharp/librsvg
  produced tofu boxes. This config points fontconfig at the bundled OFL
  fonts (PT Serif, Inter) in this directory. Loaded via FONTCONFIG_FILE in
  lib/etsy-listing-kit/generator.ts; files traced into the function bundle
  via outputFileTracingIncludes in next.config.js.
-->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
</fontconfig>
